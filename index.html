<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0b17">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Triple Threat</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>⚡</text></svg>">
<style>
:root{--bg:#0b0b17;--panel:#171734;--panel2:#23234a;--ink:#f4f4ff;--dim:#8d8db8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded",system-ui,Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.scr{flex:1;display:none;flex-direction:column;min-height:0;position:relative}
.scr.on{display:flex}
button{font-family:inherit;color:inherit}
.btn{background:linear-gradient(180deg,#ff6498,#ff3d81);color:#fff;border:0;border-radius:18px;font-weight:800;font-size:20px;padding:16px 22px;box-shadow:0 5px 0 #a91d51;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a91d51}
.btn.alt{background:linear-gradient(180deg,#34346d,#2a2a58);box-shadow:0 5px 0 #14142f}
.btn.alt:active{box-shadow:0 2px 0 #14142f}
.btn.small{font-size:15px;padding:10px 14px;border-radius:14px;box-shadow:0 3px 0 #14142f}
.btn[disabled]{opacity:.35;pointer-events:none}
input{font-family:inherit;font-size:20px;font-weight:700;background:var(--panel);color:var(--ink);border:2px solid #2d2d62;border-radius:16px;padding:14px 16px;width:100%;outline:none;-webkit-user-select:text;user-select:text}
input:focus{border-color:#19d3ff}
.center{align-items:center;justify-content:center;text-align:center;padding:20px;gap:14px}
.logo{font-weight:900;font-size:min(15vw,64px);line-height:.92;letter-spacing:-1px;background:linear-gradient(90deg,#ff3d81,#ffd23f 50%,#19d3ff);-webkit-background-clip:text;background-clip:text;color:transparent;text-transform:uppercase}
.dots{display:flex;gap:8px;justify-content:center}
.dots i{width:14px;height:14px;border-radius:50%;display:block}
.tag{color:var(--dim);font-size:15px;margin-top:-4px}
.col{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px}
.msg{min-height:20px;font-size:14px;color:#ffd23f}
.msg.err{color:#ff6b6b}
.or{color:var(--dim);font-size:13px;letter-spacing:2px}
/* lobby */
.code{font-size:min(20vw,92px);font-weight:900;letter-spacing:6px;line-height:1;font-variant-numeric:tabular-nums}
.slots{display:flex;flex-direction:column;gap:10px;width:100%;max-width:380px}
.slot{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:16px;padding:14px 16px;border-left:8px solid var(--c,#333);font-weight:800;font-size:19px;min-height:56px}
.slot.empty{opacity:.35;border-left-color:#333;font-weight:600;font-size:16px}
.slot small{margin-left:auto;color:var(--dim);font-weight:600;font-size:13px}
.seg{display:flex;background:var(--panel);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:11px;padding:10px;font-weight:800;font-size:15px;color:var(--dim)}
.seg button.on{background:var(--panel2);color:#fff}
/* game */
#bar{display:flex;gap:6px;padding:8px 10px 6px;align-items:stretch}
.rnd{background:var(--panel);border-radius:12px;padding:6px 10px;font-weight:900;font-size:13px;display:flex;align-items:center;color:var(--dim)}
.chip{flex:1;min-width:0;background:var(--panel);border-radius:12px;padding:6px 9px;border-bottom:3px solid var(--c);font-size:13px;font-weight:700;display:flex;justify-content:space-between;gap:4px;align-items:center}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip b{font-size:16px;font-variant-numeric:tabular-nums}
.chip.aw{opacity:.4}
#stage{position:relative;flex:1;min-height:0;overflow:hidden}
#gbox{position:absolute;inset:0}
#tbar{position:absolute;top:0;left:0;right:0;height:5px;z-index:4;background:#ffffff12}
#tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#19d3ff,#ff3d81)}
.ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;gap:12px;background:rgba(11,11,23,.985);z-index:5}
.ov.on{display:flex}
.ov .big{font-size:78px;line-height:1}
.ov h2{margin:0;font-size:34px;font-weight:900}
.ov p{margin:0;color:#c6c6e8;font-size:17px;max-width:320px;line-height:1.35}
.count{font-size:96px;font-weight:900;line-height:1;background:linear-gradient(90deg,#ff3d81,#ffd23f);-webkit-background-clip:text;background-clip:text;color:transparent}
.rows{display:flex;flex-direction:column;gap:8px;width:100%;max-width:360px}
.rrow{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:14px;padding:12px 14px;border-left:8px solid var(--c);font-weight:800;font-size:18px;animation:pop .4s backwards}
.rrow .m{font-size:24px;width:30px}
.rrow .l{margin-left:auto;color:#c6c6e8;font-weight:700;font-size:15px}
.rrow .pt{font-weight:900;color:#52ff7a;min-width:34px;text-align:right}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.fill{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;gap:10px}
.huge{font-size:min(20vw,84px);font-weight:900;line-height:1}
.sub{color:#cfcff0;font-size:17px;font-weight:600}
.live{display:flex;gap:6px;padding:8px 10px;width:100%}
.live div{flex:1;background:var(--panel);border-radius:10px;padding:5px 8px;font-size:12px;font-weight:800;border-bottom:3px solid var(--c);display:flex;justify-content:space-between;gap:4px}
.live div span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.page{position:absolute;inset:0;display:flex;flex-direction:column}
/* spot it */
.oh{display:flex;justify-content:space-between;padding:6px 16px;font-weight:900;font-size:18px;color:#cfcff0}
.og{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:8px 10px;width:min(100%,56vh);margin:0 auto;flex:1;align-content:center}
.oc{aspect-ratio:1;background:var(--panel);border:0;border-radius:12px;font-size:min(9vw,5.4vh);padding:0;display:flex;align-items:center;justify-content:center}
.oc:active{background:var(--panel2)}
.shake{animation:shake .3s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
/* clock */
.stop{width:min(62vw,260px);aspect-ratio:1;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#ff7a9f,#ff3d81 60%,#b01f55);color:#fff;font-weight:900;font-size:40px;box-shadow:0 8px 0 #7a1238,0 0 40px #ff3d8155}
.stop:active{transform:translateY(5px);box-shadow:0 3px 0 #7a1238}
.stop[disabled]{opacity:.3}
/* mash */
.lanes{display:flex;flex-direction:column;gap:8px;padding:10px 14px}
.lane{background:var(--panel);border-radius:10px;height:30px;position:relative;overflow:hidden}
.lane i{position:absolute;left:0;top:0;bottom:0;background:var(--c);width:0;transition:width .12s}
.lane span{position:absolute;left:10px;top:0;bottom:0;display:flex;align-items:center;font-weight:900;font-size:13px;text-shadow:0 1px 3px #000a}
.lane b{position:absolute;right:10px;top:0;bottom:0;display:flex;align-items:center;font-size:14px;text-shadow:0 1px 3px #000a}
.mash{flex:1;margin:10px 14px 16px;border-radius:30px;border:0;background:linear-gradient(180deg,#ffd23f,#ff9f1c);color:#3a2300;font-weight:900;font-size:min(20vw,80px);box-shadow:0 8px 0 #a86300;touch-action:none}
.mash:active,.mash.dn{transform:translateY(6px) scale(.985);box-shadow:0 2px 0 #a86300}
/* stroop */
.word{font-size:min(24vw,110px);font-weight:900;letter-spacing:1px}
.sbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 14px 18px;width:100%}
.sbtn{background:var(--panel2);border:0;border-radius:20px;padding:26px 0;font-weight:900;font-size:24px;box-shadow:0 5px 0 #14142f}
.sbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #14142f}
.score{font-size:22px;font-weight:900}
/* bomb */
.bomb{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;padding:10px 14px 14px}
.btile{flex:1;background:var(--panel);border-radius:22px;border:4px solid var(--c);display:flex;align-items:center;justify-content:center;gap:14px;font-weight:900;font-size:26px;position:relative;transition:transform .1s}
.btile .bi{font-size:56px;min-width:64px;text-align:center}
.btile.hold{background:linear-gradient(90deg,#3a0f1a,var(--panel))}
.btile.hold .bi{animation:throb .45s infinite alternate}
.btile.target{animation:glow .6s infinite alternate}
.btile.target:active{transform:scale(.97)}
.btile.out{opacity:.35;filter:grayscale(1)}
.bhint{text-align:center;font-weight:800;font-size:17px;color:#ffd23f;min-height:24px}
@keyframes throb{from{transform:scale(1)}to{transform:scale(1.25) rotate(8deg)}}
@keyframes glow{from{box-shadow:0 0 0 0 var(--c)}to{box-shadow:0 0 24px 4px var(--c)}}
/* splat */
.sg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:8px 10px;width:min(100%,58vh);margin:0 auto;flex:1;align-content:center}
.st{aspect-ratio:1;border-radius:12px;background:var(--panel);border:0;transition:background .08s}
.st.fresh{box-shadow:inset 0 0 0 4px #fff9}
/* minority */
.mn{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;padding:10px 14px 14px}
.mnh{font-weight:900;color:var(--dim);font-size:14px;display:flex;justify-content:space-between}
.mnq{font-size:19px;font-weight:700;text-align:center;color:#d9d9f7}
.mnb{flex:1;background:var(--panel);border:4px solid #2d2d62;border-radius:24px;font-weight:900;font-size:min(9vw,38px);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.mnb.on{border-color:#19d3ff;background:#142a4a}
.mnb.win{border-color:#52ff7a;background:#12381f}
.mnb .who{display:flex;gap:6px;min-height:20px}
.mnb .who i{width:20px;height:20px;border-radius:50%;display:block}
.mnb:active{transform:scale(.98)}
.mnbar{text-align:center;font-weight:800;font-size:16px;min-height:22px;color:#ffd23f}
/* final */
.podium{display:flex;flex-direction:column;gap:10px;width:100%;max-width:380px}
.crown{font-size:84px;line-height:1;animation:throb .6s infinite alternate}
.conf{position:absolute;top:-20px;width:10px;height:16px;animation:fall linear forwards;z-index:1;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.emo{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;max-width:100%}
.emo button{background:var(--panel);border:0;border-radius:14px;font-size:24px;padding:7px 9px}
.emo button:active{transform:scale(.88)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.fl{position:absolute;bottom:-40px;font-size:44px;animation:rise 2.4s ease-out forwards;text-align:center}
.fl small{display:block;font-size:12px;font-weight:900;padding:1px 7px;border-radius:8px;color:#000}
@keyframes rise{to{transform:translateY(-75vh) rotate(var(--r,0deg));opacity:0}}
#toast{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:50%;transform:translateX(-50%);background:#ffd23f;color:#000;font-weight:800;padding:8px 16px;border-radius:14px;z-index:60;display:none;font-size:14px}
</style>
</head>
<body>
<div id="app">
  <div id="menu" class="scr on center">
    <div class="dots"><i style="background:#ff3d81"></i><i style="background:#19d3ff"></i><i style="background:#ffd23f"></i></div>
    <div class="logo">Triple<br>Threat</div>
    <div class="tag">2–4 players · 8 chaos rounds · zero mercy</div>
    <div class="col">
      <input id="name" maxlength="12" placeholder="Your name" autocomplete="off" autocapitalize="words">
      <button class="btn" id="create">Create party</button>
      <div class="or">— OR JOIN —</div>
      <div class="row"><input id="code" maxlength="4" placeholder="CODE" autocomplete="off" autocapitalize="characters" style="text-align:center;letter-spacing:5px"><button class="btn alt" id="join">Join</button></div>
      <div class="msg" id="menumsg"></div>
    </div>
  </div>

  <div id="lobby" class="scr center">
    <div class="tag" style="margin:0">PARTY CODE</div>
    <div class="code" id="lcode">----</div>
    <div class="row"><button class="btn alt small" id="copy">Copy invite link</button></div>
    <div class="slots" id="slots"></div>
    <div class="col" id="hostctl">
      <div class="seg" id="rounds"><button data-n="5">5 rounds</button><button data-n="8" class="on">8 rounds</button></div>
      <button class="btn" id="start">Start game</button>
    </div>
    <div class="tag" id="waitmsg">Waiting for the host to start…</div>
    <div id="lemo"></div>
    <button class="btn alt small" id="leave">Leave</button>
  </div>

  <div id="game" class="scr">
    <div id="bar"></div>
    <div id="stage">
      <div id="tbar"><i></i></div>
      <div id="gbox"></div>
      <div id="intro" class="ov"><div class="big" id="ie"></div><h2 id="in"></h2><p id="id"></p><div class="count" id="icount">3</div></div>
      <div id="result" class="ov"><h2 id="rt"></h2><div class="rows" id="rrows"></div><div id="remo"></div><button class="btn alt small" id="rskip">Next ▸</button><div class="tag" id="rnext"></div></div>
    </div>
  </div>

  <div id="final" class="scr center">
    <div class="crown" id="fcrown">🏆</div>
    <div class="logo" id="fwin" style="font-size:min(11vw,48px)"></div>
    <div class="podium" id="fpod"></div>
    <div id="femo"></div>
    <div class="col" style="gap:10px">
      <button class="btn" id="again">Play again</button>
      <div class="tag" id="fwait"></div>
      <button class="btn alt small" id="fleave">Leave party</button>
    </div>
  </div>
</div>
<div id="fx"></div>
<div id="toast"></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
'use strict';
const VERSION='1.0.0';
const $=s=>document.querySelector(s);
const E=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COLORS=['#ff3d81','#19d3ff','#ffd23f','#52ff7a'];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const INTRO=4, RESULT=7;

// ---------- sound + haptics ----------
let AC=null;
function audio(){ if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}} if(AC&&AC.state==='suspended')AC.resume(); }
function beep(f=440,d=.1,type='sine',v=.15,slide=0){ if(!AC)return; try{ const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime; o.type=type;o.frequency.setValueAtTime(f,t); if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.001,t+d); o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);}catch(e){} }
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}};
const sfx={
  tap:()=>beep(520,.05,'square',.07), tick:()=>beep(1100,.03,'square',.05), go:()=>beep(880,.15,'square',.1),
  good:()=>{beep(660,.08,'triangle');setTimeout(()=>beep(990,.12,'triangle'),70);},
  bad:()=>beep(170,.22,'sawtooth',.1,-70),
  boom:()=>{beep(130,.55,'sawtooth',.25,-95);beep(60,.6,'square',.2);},
  win:()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.2,'triangle',.15),i*110)),
  count:()=>beep(700,.08,'sine',.12)
};

// ---------- shared game state ----------
let R=null, rt=0;            // latest room state + receipt time
let isHost=false, myPid=-1, myName='', peer=null, hostConn=null, partyCode='';
let H=null;                  // host-only authoritative room
const myKey=new URLSearchParams(location.search).get('key')||(()=>{try{let k=sessionStorage.tt_key;if(!k){k=Math.random().toString(36).slice(2,10);sessionStorage.tt_key=k;}return k;}catch(e){return Math.random().toString(36).slice(2,10);}})();
const remNow=()=>R?Math.max(0,R.rem-(performance.now()-rt)/1000):0;
const plOf=id=>R&&R.pl.find(p=>p.id===id);
const colOf=id=>{const p=plOf(id);return p?COLORS[p.ci]:'#888';};

function send(m){ if(isHost) hostHandle(0,m); else if(hostConn&&hostConn.open) hostConn.send(m); }

// live per-player progress strip
function liveRow(fmt){
  const el=E('div','live'),cells={};
  return{el,set(S){ for(const p of R.pl){ let c=cells[p.id]; if(!c){c=cells[p.id]=E('div');c.style.setProperty('--c',COLORS[p.ci]);c.innerHTML='<span></span><b></b>';el.append(c);} c.firstChild.textContent=p.n; c.lastChild.textContent=fmt(S.prog&&S.prog[p.id]||0); } }};
}

// ======================================================================
//  GAMES.  Host side: init / begin / tick / act / val.  Client side: mk()
// ======================================================================
const GAMES={

// ---------------- QUICK DRAW ----------------
reflex:{name:'Quick Draw',emoji:'⚡',desc:'Wait for green, then smash the screen. Tap early and eat a penalty. Best of 3 — lowest average wins.',dur:30,better:'low',fmt:v=>Math.round(v)+' ms',
  init:()=>({res:{},prog:{},delays:[0,0,0].map(()=>+rnd(1.2,3.8).toFixed(2))}),
  val:(S,id)=>S.res[id],
  mk:c=>{
    let box,big,sub,st='idle',i=0,times=[],t0=0,to=0,dead=false;
    const next=()=>{
      if(dead)return;
      if(i>=3){const avg=times.reduce((a,b)=>a+b,0)/3;big.textContent=Math.round(avg)+' ms';sub.textContent='average — waiting for the others…';box.style.background='#26264f';st='fin';c.done(avg);return;}
      st='wait';box.style.background='#5a1020';big.textContent='WAIT…';sub.textContent='Attempt '+(i+1)+' of 3 — don’t tap yet';
      to=setTimeout(()=>{if(dead)return;st='go';t0=performance.now();box.style.background='#0e9a43';big.textContent='TAP!';sub.textContent='';sfx.go();buzz(30);},c.R().S.delays[i]*1000);
    };
    const hit=()=>{
      if(st==='wait'){clearTimeout(to);times.push(900);i++;st='pause';big.textContent='TOO EARLY';sub.textContent='+900 ms penalty 🤡';sfx.bad();box.style.background='#7a3300';to=setTimeout(next,1200);}
      else if(st==='go'){const ms=Math.round(performance.now()-t0);times.push(ms);i++;st='pause';big.textContent=ms+' ms';sub.textContent=ms<220?'Absurd 🔥':ms<320?'Solid':'Sleepy 😴';sfx.good();box.style.background='#1b3a7a';to=setTimeout(next,1200);}
    };
    return{mount(r){box=E('div','fill');big=E('div','huge','Get ready');sub=E('div','sub');box.append(big,sub);box.style.background='#26264f';box.addEventListener('pointerdown',hit);r.append(box);},
      start(){next();},update(){},stop(){dead=true;clearTimeout(to);}};
  }},

// ---------------- SPOT IT ----------------
odd:{name:'Spot It',emoji:'🔍',desc:'Find the odd emoji out in each of 6 grids. Fastest total time wins. Wrong tap = +1.5 s.',dur:70,better:'low',fmt:v=>v.toFixed(1)+' s',
  init:()=>({res:{},prog:{},seed:(Math.random()*1e9)|0}),
  val:(S,id)=>S.res[id],
  mk:c=>{
    const PAIRS=[['🙂','🙃'],['😀','😃'],['🐵','🙈'],['🍎','🍅'],['🌕','🌝'],['⭐','🌟'],['🔴','🟠'],['🐶','🐕'],['😡','🤬'],['👻','💀'],['🍋','🧀'],['🌸','🌺'],['😎','🤓'],['🐱','🐯'],['🍩','🧿'],['💙','💜']];
    const GN=6,N=30;let wrap,hdr,tm,grid,live,gi=0,t0=0,pen=0,odd=0,run=false,dead=false,raf=0,fin=false;
    const build=()=>{
      const r=mulberry(c.R().S.seed+gi*7919),pr=PAIRS[Math.floor(r()*PAIRS.length)];odd=Math.floor(r()*N);
      const flip=r()<.5,base=flip?pr[1]:pr[0],oe=flip?pr[0]:pr[1];

function newRoom(){return{ph:'lobby',players:[],rn:0,tot:8,queue:[],g:null,S:null,rem:0,res:null,nid:0};}
function addPlayer(name,conn,key){
  const used=H.players.map(p=>p.ci);let ci=0;while(used.includes(ci))ci++;
  const p={id:H.nid++,name:(name||'Player').trim().slice(0,12)||'Player',ci,sc:0,aw:false,conn,key:key||''};H.players.push(p);return p;
}
const strip=S=>{if(!S)return S;const o={};for(const k in S)if(k[0]!=='_')o[k]=S[k];return o;};
function pub(){return{ph:H.ph,rn:H.rn,tot:H.queue.length||H.tot,g:H.g,S:strip(H.S),pl:H.players.map(p=>({id:p.id,n:p.name,ci:p.ci,sc:p.sc,aw:p.aw})),rem:H.rem,res:H.res,code:partyCode};}
function bc(){
  if(!H)return;
  const st=pub(),msg={t:'st',st};
  for(const p of H.players)if(p.conn&&p.conn.open){try{p.conn.send(msg);}catch(e){}}
  onState(JSON.parse(JSON.stringify(st)));
}
function startGame(){
  H.players=H.players.filter(p=>!p.aw);if(H.players.length<2)return;
  const keys=Object.keys(GAMES).sort(()=>Math.random()-.5);H.queue=keys.slice(0,Math.min(H.tot,keys.length));H.rn=0;H.players.forEach(p=>p.sc=0);startRound();
}
function startRound(){
  const g=H.queue[H.rn];H.rn++;H.g=g;H.S=GAMES[g].init(H);H.S.t=0;H.ph='intro';H.rem=INTRO;H.res=null;bc();
}
function roundOver(G,S){
  if(S.over&&(!S.pause||S.pause<=0))return true;
  if(S.res){const act=H.players.filter(p=>!p.aw);if(act.length&&act.every(p=>p.id in S.res))return true;return S.t>=G.dur+3;}
  return S.t>=G.dur;
}
function endRound(){
  const G=GAMES[H.g],S=H.S,hi=G.better==='high',n=H.players.length;
  const rows=H.players.map(p=>({id:p.id,v:(p.aw&&!(S.res&&p.id in S.res))?null:(G.val(S,p.id)??null)}));
  const key=v=>v==null?null:(hi?-v:v);
  rows.sort((a,b)=>{const ka=key(a.v),kb=key(b.v);if(ka==null&&kb==null)return 0;if(ka==null)return 1;if(kb==null)return -1;return ka-kb;});
  rows.forEach((x,i)=>{x.rank=(i>0&&key(rows[i-1].v)===key(x.v))?rows[i-1].rank:i;x.pts=x.v==null?0:Math.max(0,n-x.rank);x.label=x.v==null?'—':G.fmt(x.v);const p=H.players.find(p=>p.id===x.id);p.sc+=x.pts;});
  rows.forEach(x=>delete x.v);
  H.res={g:H.g,rows};H.ph='result';H.rem=RESULT;bc();
}
let lastT=performance.now(),tc=0;
setInterval(()=>{
  if(!H||!isHost)return;
  const now=performance.now(),dt=Math.min(.25,(now-lastT)/1000);lastT=now;tc++;
  if(H.ph==='intro'){H.rem-=dt;if(H.rem<=0){const G=GAMES[H.g];H.ph='play';H.S.t=0;G.begin&&G.begin(H,H.S);H.rem=G.dur;bc();}else if(tc%2===0)bc();}
  else if(H.ph==='play'){const G=GAMES[H.g],S=H.S;S.t+=dt;G.tick&&G.tick(H,S,dt);H.rem=Math.max(0,G.dur-S.t);if(roundOver(G,S))endRound();else if(tc%2===0)bc();}
  else if(H.ph==='result'){H.rem-=dt;if(H.rem<=0){if(H.rn>=H.queue.length){H.ph='final';H.rem=0;bc();}else startRound();}else if(tc%20===0)bc();}
  else if(tc%20===0)bc();
},50);

function hostHandle(pid,m){
  if(!H)return;
  const p=H.players.find(p=>p.id===pid);if(!p)return;
  switch(m.t){
    case 'hb':break;
    case 'done':if(H.ph==='play'&&H.S&&H.S.res&&!(pid in H.S.res)&&typeof m.v==='number')H.S.res[pid]=m.v;break;
    case 'prog':if(H.ph==='play'&&H.S&&H.S.prog)H.S.prog[pid]=m.v;break;
    case 'act':if(H.ph==='play'){const G=GAMES[H.g];G.act&&G.act(H,H.S,pid,m);}break;
    case 'emo':relayEmo(pid,m.e);break;
    case 'start':if(pid===0&&H.ph==='lobby')startGame();break;
    case 'rounds':if(pid===0&&H.ph==='lobby'){H.tot=m.n===5?5:8;bc();}break;
    case 'skip':if(pid===0&&H.ph==='result')H.rem=0;break;
    case 'again':if(pid===0&&H.ph==='final'){H.players=H.players.filter(p=>!p.aw);H.players.forEach(p=>p.sc=0);H.ph='lobby';H.rn=0;H.queue=[];H.g=null;H.S=null;H.res=null;bc();}break;
  }
}
const EMOS=['😂','🔥','💀','🤡','😭','👏'];
function relayEmo(pid,e){
  if(!EMOS.includes(e))return;
  const msg={t:'emo',e,pid};
  for(const p of H.players)if(p.conn&&p.conn.open){try{p.conn.send(msg);}catch(x){}}
  floatEmo(e,pid);
}
function onHostData(c,m){
  if(!H||!m)return;
  if(m.t==='hello'){
    if(m.v!==VERSION){c.send({t:'kick',m:'Version mismatch — hard refresh the page (host has v'+VERSION+')'});setTimeout(()=>c.close(),400);return;}
    let p=H.players.find(p=>p.key&&p.key===m.k);
    if(p){p.conn=c;p.aw=false;}
    else if(H.ph!=='lobby'){c.send({t:'kick',m:'Game already in progress'});setTimeout(()=>c.close(),400);return;}
    else if(H.players.length>=4){c.send({t:'kick',m:'Party is full (4 max)'});setTimeout(()=>c.close(),400);return;}
    else p=addPlayer(m.name,c,m.k);
    c.__pid=p.id;c.send({t:'welcome',pid:p.id});bc();return;
  }
  if(c.__pid==null)return;
  hostHandle(c.__pid,m);
}
function onHostClose(c){
  if(!H)return;const p=H.players.find(p=>p.conn===c);if(!p)return;
  p.conn=null;
  if(H.ph==='lobby')H.players=H.players.filter(x=>x!==p);else if(H.ph==='final')p.aw=true;else p.aw=true;
  bc();
}

// ======================================================================
//  NETWORK (PeerJS, host-authoritative, no backend)
// ======================================================================
const ICE={config:{iceServers:[
  {urls:'stun:stun.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'},
  {urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},
  {urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'},
  {urls:'turn:openrelay.metered.ca:443?transport=tcp',username:'openrelayproject',credential:'openrelayproject'}]}};
const CODE_CHARS='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const genCode=()=>Array.from({length:4},()=>CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)]).join('');
let joinTok=0,hbTimer=0,lastSt=0,rejoining=false,lostAt=0,connecting=false;

function menuMsg(m,err){const e=$('#menumsg');e.textContent=m||'';e.className='msg'+(err?' err':'');}
function readName(){myName=($('#name').value||'').trim().slice(0,12);if(!myName)myName='Player'+(10+Math.floor(Math.random()*90));try{localStorage.tt_name=myName;}catch(e){}return myName;}

function createParty(attempt=0){
  audio();if(connecting&&attempt===0)return;
  if(typeof Peer==='undefined'){menuMsg('Multiplayer library failed to load (offline?)',true);return;}
  if(attempt===0){readName();menuMsg('Creating party…');connecting=true;}
  const tok=attempt===0?++joinTok:joinTok;
  partyCode=genCode();
  const pr=peer=new Peer('tt3-'+partyCode,ICE);
  pr.on('open',()=>{if(tok!==joinTok)return;connecting=false;isHost=true;H=newRoom();const me=addPlayer(myName,null,myKey);myPid=me.id;menuMsg('');bc();});
  pr.on('error',e=>{if(tok!==joinTok)return;if(e.type==='unavailable-id'&&attempt<5){try{pr.destroy();}catch(x){}createParty(attempt+1);}else{connecting=false;menuMsg('Network error: '+e.type,true);}});
  pr.on('connection',c=>{c.on('data',m=>onHostData(c,m));c.on('close',()=>onHostClose(c));c.on('error',()=>onHostClose(c));});
}
function connectHost(code,cb){
  const tok=++joinTok;let done=false,to=0;
  const pr=peer=new Peer(undefined,ICE);
  const fail=m=>{if(done)return;done=true;clearTimeout(to);try{pr.destroy();}catch(e){}if(tok===joinTok)cb.fail(m);};
  pr.on('error',e=>fail(e.type==='peer-unavailable'?'No party with that code':'Network error: '+e.type));
  pr.on('open',()=>{
    const c=pr.connect('tt3-'+code,{serialization:'json',reliable:true});
    to=setTimeout(()=>fail("Couldn't reach that party. Same wifi helps — and make sure everyone has the latest version."),15000);
    const pcn=c.peerConnection;if(pcn)pcn.addEventListener('iceconnectionstatechange',()=>{if(pcn.iceConnectionState==='failed')fail("Found the party but couldn't connect. Try the same wifi, or turn off VPN / school filters.");});
    c.on('open',()=>{if(done||tok!==joinTok)return;done=true;clearTimeout(to);hostConn=c;c.send({t:'hello',v:VERSION,k:myKey,name:myName});cb.ok(c);});
    c.on('data',onClientData);
    c.on('close',()=>{if(c===hostConn)lostHost();else if(!done)fail('Connection closed');});
  });
}
function joinParty(){
  audio();readName();
  const code=($('#code').value||'').toUpperCase().trim();
  if(code.length!==4){menuMsg('Enter the 4-letter code',true);return;}
  if(typeof Peer==='undefined'){menuMsg('Multiplayer library failed to load (offline?)',true);return;}
  if(connecting)return;connecting=true;menuMsg('Connecting…');partyCode=code;
  connectHost(code,{ok:()=>{connecting=false;isHost=false;lastSt=performance.now();startHb();},fail:m=>{connecting=false;menuMsg(m,true);}});
}
function startHb(){clearInterval(hbTimer);hbTimer=setInterval(()=>{if(hostConn&&hostConn.open)try{hostConn.send({t:'hb'});}catch(e){}if(!isHost&&!rejoining&&R&&performance.now()-lastSt>6000)lostHost();},1000);}
function lostHost(){
  if(isHost||rejoining||!R)return;
  rejoining=true;lostAt=performance.now();toast('Connection lost — reconnecting…',0);
  const oh=hostConn;hostConn=null;try{oh&&oh.close();}catch(e){}
  tryRejoin();
}
function tryRejoin(){
  if(!rejoining)return;
  const op=peer;peer=null;try{op&&op.destroy();}catch(e){}
  connectHost(partyCode,{ok:()=>{rejoining=false;lastSt=performance.now();toast('',0);},fail:()=>{if(!rejoining)return;if(performance.now()-lostAt>30000)leave('Lost connection to the host.',true);else setTimeout(tryRejoin,1500);}});
}
function onClientData(m){
  if(!m)return;
  if(m.t==='st'){lastSt=performance.now();onState(m.st);}
  else if(m.t==='welcome')myPid=m.pid;
  else if(m.t==='kick')leave(m.m,true);
  else if(m.t==='emo')floatEmo(m.e,m.pid);
}
function leave(msg,err){
  joinTok++;connecting=false;rejoining=false;clearInterval(hbTimer);toast('',0);
  if(H){for(const p of H.players)if(p.conn){try{p.conn.send({t:'kick',m:'The host left the party.'});}catch(e){}}}
  const hc=hostConn;hostConn=null;try{hc&&hc.close();}catch(e){}
  const pr=peer;peer=null;setTimeout(()=>{try{pr&&pr.destroy();}catch(e){}},400);
  H=null;R=null;isHost=false;partyCode='';endRound_ui();showScr('menu');menuMsg(msg||'',!!err);
}

// ======================================================================
//  UI
// ======================================================================
function showScr(id){document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id===id));}
let toastT=0;
function toast(m,ms=2200){const t=$('#toast');clearTimeout(toastT);if(!m){t.style.display='none';return;}t.textContent=m;t.style.display='block';if(ms)toastT=setTimeout(()=>t.style.display='none',ms);}
function floatEmo(e,pid){
  const d=E('div','fl','<span>'+e+'</span><small></small>');const p=plOf(pid);
  const s=d.querySelector('small');s.textContent=p?p.n:'';s.style.background=p?COLORS[p.ci]:'#888';
  d.style.left=(8+Math.random()*78)+'%';d.style.setProperty('--r',(Math.random()*40-20)+'deg');$('#fx').append(d);setTimeout(()=>d.remove(),2500);
}
function emoBar(host){host.innerHTML='';const b=E('div','emo');EMOS.forEach(e=>{const x=E('button','',e);x.addEventListener('pointerdown',()=>{audio();sfx.tap();send({t:'emo',e});});b.append(x);});host.append(b);}

let cur=null,curRound=-1,curGame='',sentDone=false,lastCount=0;
const ctx={R:()=>R,rt:()=>rt,me:()=>myPid,pl:plOf,col:colOf,
  done:v=>{if(sentDone)return;sentDone=true;send({t:'done',v});},
  prog:v=>send({t:'prog',v}),
  act:m=>send(Object.assign({t:'act'},m))};
function endRound_ui(){if(cur){try{cur.stop();}catch(e){}cur=null;}curRound=-1;$('#gbox').innerHTML='';}

function onState(st){
  R=st;rt=performance.now();
  // header chips
  if(st.ph!=='lobby'&&st.ph!=='final'){
    const bar=$('#bar');bar.innerHTML='';bar.append(E('div','rnd',st.rn+'/'+st.tot));
    for(const p of st.pl){const c=E('div','chip'+(p.aw?' aw':''),'<span></span><b>'+p.sc+'</b>');c.style.setProperty('--c',COLORS[p.ci]);c.firstChild.textContent=p.n+(p.id===myPid?' ★':'');bar.append(c);}
  }
  if(st.ph==='lobby'){endRound_ui();showScr('lobby');drawLobby();return;}
  if(st.ph==='final'){endRound_ui();showScr('final');drawFinal();return;}
  showScr('game');
  const G=GAMES[st.g];
  if(curRound!==st.rn||curGame!==st.g){endRound_ui();curRound=st.rn;curGame=st.g;sentDone=false;cur=G.mk(ctx);cur.mount($('#gbox'));cur.started=false;lastCount=0;
    $('#ie').textContent=G.emoji;$('#in').textContent=G.name;$('#id').textContent=G.desc;}
  $('#intro').classList.toggle('on',st.ph==='intro');
  $('#result').classList.toggle('on',st.ph==='result');
  if(st.ph==='play'&&!cur.started){cur.started=true;cur.start();sfx.go();}
  if(st.ph==='result')drawResult();
  try{cur.update(st.S,st);}catch(e){console.error(e);}
}
function drawLobby(){
  $('#lcode').textContent=R.code;
  const sl=$('#slots');sl.innerHTML='';
  for(let i=0;i<4;i++){const p=R.pl[i];const d=E('div','slot'+(p?'':' empty'));if(p){d.style.setProperty('--c',COLORS[p.ci]);d.textContent=p.n;if(p.id===myPid){const s=E('small','','you');d.append(s);}if(p.id===0){const s=E('small','','host');if(p.id!==myPid)d.append(s);}}else d.textContent='Waiting for player…';sl.append(d);}
  const host=isHost;
  $('#hostctl').style.display=host?'flex':'none';$('#waitmsg').style.display=host?'none':'block';
  $('#start').disabled=R.pl.length<2;$('#start').textContent=R.pl.length<2?'Need 2+ players':'Start game';
  document.querySelectorAll('#rounds button').forEach(b=>b.classList.toggle('on',+b.dataset.n===(H?H.tot:8)));
  if(!$('#lemo').firstChild)emoBar($('#lemo'));
}
function drawResult(){
  const rs=R.res;if(!rs)return;const G=GAMES[rs.g];
  $('#rt').textContent=G.emoji+' '+G.name;
  const rw=$('#rrows');if(rw.dataset.k!==String(R.rn)){rw.dataset.k=R.rn;rw.innerHTML='';
    rs.rows.forEach((x,i)=>{const p=plOf(x.id);const d=E('div','rrow','<span class="m"></span><span class="n"></span><span class="l"></span><span class="pt"></span>');d.style.setProperty('--c',COLORS[p.ci]);d.style.animationDelay=(i*.12)+'s';
      d.querySelector('.m').textContent=x.pts===0?'💤':['🥇','🥈','🥉','4️⃣'][x.rank]||'';d.querySelector('.n').textContent=p.n;d.querySelector('.l').textContent=x.label;d.querySelector('.pt').textContent=x.pts?'+'+x.pts:'';rw.append(d);});
    if(rs.rows[0]&&rs.rows[0].pts)sfx.win();
    emoBar($('#remo'));}
  $('#rskip').style.display=isHost?'inline-block':'none';
}
let confettiDone=false;
function drawFinal(){
  const pl=[...R.pl].sort((a,b)=>b.sc-a.sc);let rk=0;pl.forEach((p,i)=>{p.rk=(i>0&&pl[i-1].sc===p.sc)?pl[i-1].rk:i;});
  const winners=pl.filter(p=>p.rk===0);
  $('#fwin').textContent=winners.length>1?winners.map(p=>p.n).join(' & ')+' tie!':winners[0].n+' wins!';
  const pod=$('#fpod');pod.innerHTML='';
  pl.forEach((p,i)=>{const d=E('div','rrow','<span class="m"></span><span class="n"></span><span class="l"></span>');d.style.setProperty('--c',COLORS[p.ci]);d.style.animationDelay=(i*.15)+'s';d.querySelector('.m').textContent=['🥇','🥈','🥉','4️⃣'][p.rk]||'';d.querySelector('.n').textContent=p.n;d.querySelector('.l').innerHTML='<b style="font-size:22px;color:#fff">'+p.sc+'</b> pts';pod.append(d);});
  $('#again').style.display=isHost?'block':'none';$('#fwait').textContent=isHost?'':'Waiting for the host…';
  if(!$('#femo').firstChild)emoBar($('#femo'));
  if(!confettiDone){confettiDone=true;sfx.win();buzz([60,40,60]);const f=$('#final');for(let i=0;i<70;i++){const c=E('i','conf');c.style.left=Math.random()*100+'%';c.style.background=COLORS[i%4];c.style.animationDuration=(2+Math.random()*2.5)+'s';c.style.animationDelay=Math.random()*1.2+'s';f.append(c);setTimeout(()=>c.remove(),6500);}}
}
let lastIntro=0;
function frame(){
  requestAnimationFrame(frame);
  if(!R)return;
  const rem=remNow();
  if(R.ph==='intro'){const n=Math.max(1,Math.ceil(rem));$('#icount').textContent=n;if(n!==lastIntro){lastIntro=n;if(n<=3)sfx.count();}}
  else lastIntro=0;
  if(R.ph==='play'&&curGame){const G=GAMES[curGame];$('#tbar i').style.width=(clamp(rem/G.dur,0,1)*100)+'%';}else $('#tbar i').style.width='100%';
  if(R.ph==='result')$('#rnext').textContent='Next round in '+Math.ceil(rem)+'…';
  if(cur&&cur.frame&&(R.ph==='play'||R.ph==='intro')){try{cur.frame(rem);}catch(e){}}
}
requestAnimationFrame(frame);

// ---------- wiring ----------
$('#create').addEventListener('click',()=>createParty(0));
$('#join').addEventListener('click',joinParty);
$('#code').addEventListener('input',e=>{e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'');});
$('#code').addEventListener('keydown',e=>{if(e.key==='Enter')joinParty();});
$('#name').addEventListener('keydown',e=>{if(e.key==='Enter')createParty(0);});
$('#start').addEventListener('click',()=>{audio();send({t:'start'});});
$('#again').addEventListener('click',()=>{confettiDone=false;send({t:'again'});});
$('#rskip').addEventListener('click',()=>send({t:'skip'}));
$('#leave').addEventListener('click',()=>leave());
$('#fleave').addEventListener('click',()=>leave());
document.querySelectorAll('#rounds button').forEach(b=>b.addEventListener('click',()=>send({t:'rounds',n:+b.dataset.n})));
$('#copy').addEventListener('click',()=>{
  const url=location.origin+location.pathname+'?join='+partyCode;
  if(navigator.share){navigator.share({title:'Triple Threat',text:'Join my Triple Threat party: '+partyCode,url}).catch(()=>{});return;}
  (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(()=>toast('Invite link copied'),()=>toast('Code: '+partyCode));
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!isHost&&R&&!rejoining&&(!hostConn||!hostConn.open))lostHost();});
document.addEventListener('contextmenu',e=>e.preventDefault());
try{$('#name').value=localStorage.tt_name||'';}catch(e){}
{const j=new URLSearchParams(location.search).get('join');if(j){$('#code').value=j.toUpperCase().slice(0,4);setTimeout(()=>$('#name').focus(),100);}}
// auto-update to the newest deployed version
try{fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(t=>{const m=t.match(/const VERSION='([^']+)'/);if(m&&m[1]!==VERSION&&!sessionStorage.tt_rl){sessionStorage.tt_rl=1;const q=new URLSearchParams(location.search);q.set('_v',m[1]);location.replace(location.pathname+'?'+q.toString());}}).catch(()=>{});}catch(e){}
</script>
</body>
